services:
  backend:
    build: ./backend
    container_name: weather-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Used by the browser, so it must be reachable from the host machine.
        VITE_API_URL: http://localhost:8000
    container_name: weather-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
